<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShortURL — โครงสร้างระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--panel:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--accent-soft:#eef2ff;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#151b2e;--text:#e8ecf5;--muted:#9aa4bd;--line:#242c45;--accent:#8b8cf8;--accent-soft:#1d2342;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 "Noto Sans Thai",system-ui,sans-serif;display:grid;grid-template-columns:264px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.brand b{display:block;font-size:15px;line-height:1.2}.brand small{color:var(--muted);font-size:12px}
.grp{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:14px 10px 6px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.nav button:hover{background:var(--accent-soft)}
.nav button.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.nav button b{font-size:14px;font-weight:600}.nav button.on b{color:var(--accent)}
.nav button span{font-size:12px;color:var(--muted)}
main{padding:28px 32px 48px;min-width:0;max-width:1500px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font-size:26px;line-height:1.25;letter-spacing:-.01em}.head p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools button{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.zoom{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.zoom button{box-shadow:none;border:0;padding:5px 11px}.zoom span{min-width:46px;text-align:center;font-size:12.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:6px;vertical-align:-2px;border:2px solid}
.canvas{background:#fff;border-radius:0 0 18px 18px;overflow:auto;padding:28px;min-height:420px;height:calc(100vh - 250px);min-height:460px;background-image:radial-gradient(#e5e7eb 1px,transparent 1px);background-size:22px 22px}
.card.nolegend .canvas{border-radius:18px}
.canvas svg{display:block;margin:0 auto;max-width:none !important}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.note{padding:14px 16px;border-radius:14px}
.note b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}.note p{margin:0;font-size:13.5px;color:var(--muted)}
.err{padding:24px;color:#b91c1c}
@media(max-width:900px){body{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{flex-direction:row;flex-wrap:wrap}main{padding:20px 16px}}
</style>
</head>
<body>
<aside>
 <div class="brand"><div class="logo">S</div><div><b>ShortURL</b><small>โครงสร้างระบบ</small></div></div>
 <div id="nav"></div>
</aside>
<main>
 <div class="head">
  <div><h1 id="t"></h1><p id="s"></p></div>
  <div class="tools">
   <div class="zoom"><button id="zo" title="ย่อ">−</button><span id="zv">100%</span><button id="zi" title="ขยาย">+</button><button id="zf">พอดีจอ</button></div>
   <button id="svg">ดาวน์โหลด SVG</button><button id="png">ดาวน์โหลด PNG</button>
  </div>
 </div>
 <div class="card" id="card"><div class="legend" id="lg"></div><div class="canvas" id="cv"></div></div>
 <div class="notes" id="notes"></div>
</main>

ser_agent\n        string referer\n        string country \"ISO alpha-2\"\n        enum device \"desktop|mobile|tablet|bot|unknown\"\n        string os\n        string browser\n        datetime clicked_at \"ลบเมื่อเกิน retention\"\n    }\n    LINK_DAILY_STATS {\n        int link_id PK,FK \"CASCADE\"\n        date day PK \"UTC\"\n        int clicks\n    }\n    BLOCKED_DOMAINS {\n        int id PK\n        string domain UK \"lowercase (CHECK)\"\n        string reason\n        uuid created_by_id FK \"SET NULL\"\n        datetime created_at\n    }\n    AUDIT_LOGS {\n        int id PK\n        uuid actor_id FK \"SET NULL\"\n        enum action \"USER_LOGIN, USER_BAN, DOMAIN_BLOCK ...\"\n        enum target_type \"USER | LINK | DOMAIN | API_KEY\"\n        string target_id\n        string detail \"nullable\"\n        datetime created_at\n    }\n", "legend": [], "notes": [["users + sso_identities", "ไม่มีรหัสผ่าน — ล็อกอินด้วย SSO เท่านั้น; ตัวตนจาก Google/Microsoft แยกเป็น sso_identities (1 คนหลาย provider) และ api_keys ให้ CLI"], ["links / clicks", "click_count เก็บซ้ำใน links เพื่ออ่านเร็ว; clicks ดิบถูกลบเมื่อเกิน 90 วัน แต่ link_daily_stats เก็บยอดรายวันถาวร; original_host ไว้บล็อกโดเมน"], ["refresh token", "ไม่เก็บใน DB — เป็น JWT 7 วัน หมุนทุกครั้ง สถานะอยู่ใน Redis (rt:{jti})"], ["Redis (ไม่อยู่ใน ER)", "link:{code} cache · clicks:queue คิวคลิก · bl:{jti} blacklist · rt:{jti} refresh token · rtnbf:{uid} เพิกถอน session · rate limit · sso:{state}"]]}];

  const vb=s.viewBox.baseVal;natural={w:vb&&vb.width?vb.width:parseFloat(s.getAttribute("width")),h:vb&&vb.height?vb.height:parseFloat(s.getAttribute("height"))};s.removeAttribute("width");s.removeAttribute("height");fit()}

function dl(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function cleanSvg(){const s=$("cv").querySelector("svg").cloneNode(true);s.setAttribute("width",natural.w);s.setAttribute("height",natural.h);s.style.cssText="";s.setAttribute("xmlns","http://www.w3.org/2000/svg");return s}
$("svg").onclick=()=>{if(natural)dl(cur+".svg",new Blob([new XMLSerializer().serializeToString(cleanSvg())],{type:"image/svg+xml"}))};
$("png").onclick=()=>{if(!natural)return;const x=new XMLSerializer().serializeToString(cleanSvg()),img=new Image(),k=2;img.onload=()=>{const c=document.createElement("canvas");c.width=natural.w*k+80;c.height=natural.h*k+80;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,40,40,natural.w*k,natural.h*k);c.toBlob(b=>dl(cur+".png",b))};img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(x)};
