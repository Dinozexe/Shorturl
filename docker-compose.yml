# P1: เฉพาะ postgres + redis (service อื่นเพิ่มทีละ phase)
name: shorturl

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shorturl
      POSTGRES_PASSWORD: shorturl
      POSTGRES_DB: shorturl
    ports:
      - "5442:5432" # host 5442 กันชนกับ postgres ที่ลงในเครื่อง (5432/5433)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorturl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379" # host 6380 กันชนกับ redis ที่ลงในเครื่อง (6379)

volumes:
  pgdata:
