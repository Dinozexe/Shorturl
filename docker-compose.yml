# P1: เฉพาะ postgres + redis (service อื่นเพิ่มทีละ phase)
name: shorturl

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shorturl
      POSTGRES_PASSWORD: shorturl
      POSTGRES_DB: shorturl
    ports:
      - "5442:5432" # host 5442 กันชนกับ postgres ที่ลงในเครื่อง (5432/5433)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorturl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379" # host 6380 กันชนกับ redis ที่ลงในเครื่อง (6379)

  # service ของแอป (ไม่รันตอน `docker compose up -d` ปกติ; ใช้: docker compose --profile full up --build)
  core-api:
    profiles: ["full"]
    build: ./services/core-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shorturl:shorturl@postgres:5432/shorturl
      REDIS_URL: redis://redis:6379
      ANALYTICS_URL: http://analytics-service:4002
      NODE_ENV: development # compose ใช้ HTTP ในเครื่อง; production จริงตั้งใน render.yaml
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  redirect-service:
    profiles: ["full"]
    build: ./services/redirect-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shorturl:shorturl@postgres:5432/shorturl
      REDIS_URL: redis://redis:6379
      ANALYTICS_URL: http://analytics-service:4002
      PORT: "4001"
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    profiles: ["full"]
    build: ./services/analytics-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shorturl:shorturl@postgres:5432/shorturl
      REDIS_URL: redis://redis:6379
      PORT: "4002"
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
